description = "自动化处理 img/raw 下的错题图片：OCR、智能分类、写入错题集、提取知识点并归档"
prompt = """
请按以下步骤自动化处理错题（严禁跳过任何步骤）：

1.  **检查与OCR**: 
    - 检查 `img/raw/` 目录下是否有新的图片文件。
    - 如果有，使用 `tesseract 'img/raw/<filename>' stdout -l chi_sim` 识别图片文字。
    - 如果没有新图片，则停止并提示用户。

2.  **内容分析与整理**:
    - 分析识别出的文本，将其整理为 Markdown 格式的题目（包含：题目原文、选项、正确答案、我的答案、解析、错误分析）。
    - **智能分类**: 针对每一道题，判断其所属的知识领域（例如：整合、范围、进度、成本、质量、资源、沟通、风险、采购、相关方、敏捷）。

3.  **分发写入 (关键步骤)**:
    - 将整理好的题目，**分别追加**到 `mistakes/` 目录下对应的 Markdown 文件中。
    - 映射规则示例：
        - 风险类题目 -> `mistakes/07-风险管理.md`
        - 成本类题目 -> `mistakes/04-成本管理.md`
        - 敏捷类题目 -> `mistakes/08-敏捷管理.md`
        - 如果是新领域（如采购），请创建新文件 `mistakes/XX-采购管理.md` 并追加。
    - **注意**: 不要覆盖原文件内容，务必使用追加模式。

4.  **知识点提炼与更新**:
    - 从错题中提炼核心考点和知识点。
    - 将这些知识点补充到 `notes/` 目录下对应的核心笔记文件中（如 `notes/01-人员域核心考点精解.md` 等）。
    - 确保补充内容融入现有结构，不要破坏文档大纲。

5.  **归档与提交**:
    - 将处理完的图片移动到 `img/processed/` 目录。
    - 使用 `git add .` 和 `git commit` 提交更改，Message 格式："feat(mistakes): 整理 [日期] 错题并更新知识点"。

请开始执行第一步。
"""
